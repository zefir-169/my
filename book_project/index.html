<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя IT-Библиотека</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f0f2f5; font-family: sans-serif; }
        /* Делаем карточки удобными для нажатия пальцем */
        .card { 
            border: none; 
            border-radius: 20px; 
            cursor: pointer; 
            transition: 0.2s; 
            margin-bottom: 15px;
        }
        .card:active { transform: scale(0.95); } /* Эффект нажатия на телефоне */
        
        .badge { font-size: 0.75rem; padding: 6px 12px; border-radius: 8px; }
        
        /* Настройка картинки в модальном окне для телефона */
        #modalImage { 
            width: 100%; 
            max-width: 250px; 
            height: auto; 
            border-radius: 12px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        h1 { font-weight: 800; color: #1a1a1a; font-size: 1.8rem; }
    </style>
</head>
<body>

<div class="container py-4">
    <h1 class="text-center mb-4">Цифровая библиотека</h1>
    
    <div class="mb-4">
        <input type="text" id="searchInput" class="form-control form-control-lg border-0 shadow-sm" placeholder="🔍 Найти книгу или тему..." style="border-radius: 15px;">
    </div>

    <div class="row" id="booksGrid"></div>
</div>

<div class="modal fade" id="bookModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered p-3">
        <div class="modal-content" style="border-radius: 25px; border: none;">
            <div class="modal-header border-0">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center pt-0">
                <img id="modalImage" src="" alt="Обложка">
                
                <h4 id="modalTitle" class="fw-bold mb-1"></h4>
                <p id="modalAuthor" class="text-primary mb-3"></p>
                
                <div class="text-start px-2">
                    <p id="modalText" style="color: #444; line-height: 1.6;"></p>
                </div>
                
                <a id="modalLink" href="#" target="_blank" class="btn btn-primary btn-lg w-100 mt-3 shadow-sm" style="border-radius: 15px;">
                    Читать книгу полностью
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    // ТВОЯ БАЗА ДАННЫХ
    const books = [
        { 
            title: "Информатика. 10 класс", 
            author: "Л.Л. Босова", 
            cat: "Школа", 
            image: "static/images/bosova.jpg", 
            link: "static/books/bosova_10.pdf", 
            text: "Основной учебник для подготовки к урокам и экзаменам. Понятный разбор теории." 
        },
        { 
            title: "Структура и интерпретация компьютерных программ", 
            author: "Харольд Абельсон", 
            cat: "От алгоритмов до кода", 
            image: "static/images/struk.jpg", 
            link: "static/books/struc.pdf", 
            text: "Книга «Структура и интерпретация компьютерных программ» посвящена описанию различных систем программного синтаксиса, анализу перехода от набора алгоритмов к коду. Подробное внимание уделяется обсуждению «элементарных» программ, использующихся в качестве элементов конструкций более высокого уровня сложности, оптимизации соотношения их «веса» и эффективности." 
        },
        { 
            title: "Грокаем алгоритмы", 
            author: "А. Бхаргава", 
            cat: "Алгоритмы", 
            image: "static/images/algorithms.jpg", 
            link: "static/books/algorithms.pdf", 
            text: "Самая понятная книга про алгоритмы. Минимум математики, максимум картинок." 
        },
        {
            title: "Хочу в геймдев!", 
            author: "Вячеслав Уточкин", 
            cat: "Первая игра", 
            image: "static/images/game.jpg", 
            link: "static/books/game.pdf", 
            text: "Книга, которая предназначена для начинающих в игровой индустрии. Она помогает получить базовые знания о геймдеве, понять процессы разработки игр и подготовиться к карьере в этой сфере." 
        },
        {
            title: "HTML и CSS. Разработка и дизайн веб-сайтов", 
            author: "Джон Дакетт", 
            cat: "Первый сайт", 
            image: "static/images/web.jpg", 
            link: "static/books/web.pdf", 
            text: "это руководство для изучения основ вёрстки и дизайна веб-сайтов. Она предназначена для начинающих, не требует специальных навыков для освоения." 
        },
        // Можно добавить еще 3 книги по такому же шаблону
    ];

    function render(data) {
        const grid = document.getElementById('booksGrid');
        grid.innerHTML = data.map((book, index) => `
            <div class="col-12 col-md-4">
                <div class="card p-3 shadow-sm" onclick="openBook(${index})">
                    <div class="mb-2"><span class="badge bg-primary-soft text-primary" style="background: #e7f0ff;">${book.cat}</span></div>
                    <h5 class="fw-bold mb-1">${book.title}</h5>
                    <p class="text-muted small mb-0">${book.author}</p>
                </div>
            </div>
        `).join('');
    }

    window.openBook = function(index) {
        const book = books[index];
        document.getElementById('modalTitle').innerText = book.title;
        document.getElementById('modalAuthor').innerText = book.author;
        document.getElementById('modalText').innerText = book.text;
        document.getElementById('modalImage').src = book.image;
        document.getElementById('modalLink').href = book.link;
        
        new bootstrap.Modal(document.getElementById('bookModal')).show();
    }

    document.getElementById('searchInput').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        render(books.filter(b => b.title.toLowerCase().includes(val) || b.cat.toLowerCase().includes(val)));
    };

    render(books);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
